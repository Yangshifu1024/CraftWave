name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # push 与同一分支的 PR 共用一组（head_ref 归一），后跑的取消先跑的
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端检查（${{ matrix.os }}）
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # vitest 不在此跑：契约测试依赖 cargo test 产出的 manifest/fixture
      # （§12.3 CI 顺序 = cargo test → vitest，缺文件必须红，不静默跳过），
      # 完整前端测试在 backend 作业 cargo test 之后执行（见下）。

  backend:
    name: Rust 检查（${{ matrix.os }}）
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        name: Linux 系统依赖（tauri 编译需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev
      - name: fmt / clippy / test（debug 构建无需前端产物）
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
        working-directory: src-tauri
      # 契约闭环（§12.3）：cargo test 产出 manifest/fixture 后跑完整前端测试
      # （含 contract.test 双向扫描）；vitest 纯逻辑无平台差异，仅 ubuntu 跑。
      - if: runner.os == 'Linux'
        uses: pnpm/action-setup@v4
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: runner.os == 'Linux'
        name: 前端测试（契约产物已生成）
        run: |
          pnpm install --frozen-lockfile
          pnpm test
