name: Build

# 只有 tag push（或手动触发）才做三平台打包；日常检查走 ci.yml。
# tag push 时：先建 Release 草稿（标题 + 自动化说明），三平台构建完成后把
# 安装包挂载到该草稿。上传走 uploads.github.com（gh release upload），
# 不高频调用 api.github.com；最终下载链接为 github.com/<repo>/releases/download/。

on:
  push:
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: 创建 Release 草稿
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gh release create（草稿，generate-notes）
        run: |
          gh release create "$TAG" --draft --title "CraftWave $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  build:
    name: 三平台构建（${{ matrix.os }}）
    needs: release
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        name: Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - name: Rust 检查（fmt / clippy / test）
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
        working-directory: src-tauri
      # macOS 仅出 arm64（2026-10-28 用户决策放弃 Intel，FR-16-01 universal 口径随之收窄）
      - run: pnpm build
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
      - name: 收集安装包
        shell: bash
        run: |
          files=()
          for f in \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -e "$f" ] && files+=("$f")
          done
          [ ${#files[@]} -gt 0 ] || { echo "未找到安装包"; ls -R src-tauri/target/release/bundle || true; exit 1; }
          echo "FILES=${files[*]}" >> "$GITHUB_ENV"
      - name: 挂载产物到 Release 草稿
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release upload "$TAG" $FILES --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
