[package]
name = "craftwave-engine"
version = "0.1.0"
description = "CraftWave 引擎：代理运行、工具、存储、知识、MCP、git——零框架依赖纯库"
edition = "2024"
rust-version = "1.97"

[lib]
name = "craftwave_engine"

[features]
# TS 契约导出（ts_rs derive）：壳的 test 构建激活（dev-dependencies 引入
# features=["ts"]）——engine 自身 test 亦开。生产构建零开销。
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# 契约负载类型的 TS 声明生成器（feature "ts" 门控，见上）
ts-rs = { version = "12.0.1", features = ["serde-json-impl"], optional = true }
# MCP：preserve_order = serde_json::Map 换 IndexMap 底座——mcp.json
# 的未知字段经 serde(flatten) round-trip 时保持出现顺序
serde_json = { version = "1", features = ["preserve_order"] }
# 双版本验证：0.45.0 主底料；=0.46.0-rc.1 已平行重验通过（零改动）
rig = "0.45.0"
futures = "0.3"
# mock_chat 的 sleep（time feature）；process/macros/sync/rt：命令子进程、
# select!、Notify、任务驱动；net：SSRF 共享层的 tokio::net::lookup_host
tokio = { version = "1", default-features = false, features = ["time", "process", "macros", "sync", "rt", "net"] }
# CancellationToken（cancel_run 的置位载体）
tokio-util = { version = "0.7", features = ["rt"] }
# providers：ProviderConfig.id / ProviderModel.id 的 uuid v4
uuid = { version = "1", features = ["v4"] }
# storage：段指纹/条目内容哈希；tools：edit 版本指纹
sha2 = "0.11"
# storage：整文件原子写 temp+fsync+rename
tempfile = "3"
# tools：编码解码、ripgrep 内嵌、图片 base64
encoding_rs = "0.8.42"
chardetng = "1.0.0"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
# glob 工具的文件名模式匹配：globset（ignore 的底层依赖，锁面不新增下载）
globset = "0.4.20"
regex = "1.13.1"
base64 = "0.23.1"
# tools：命令输出 ANSI/OSC 清洗
anstream = "0.6"
# MCP 客户端：rig-rmcp 0.45 选型，对齐 rig 0.45.0 并把 rmcp 锚定 ^3.5
rig-rmcp = "0.45.0"
rmcp = { version = "3.5", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
# reqwest：rustls TLS（无 OpenSSL 纪律）、gzip、socks、system-proxy
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "socks", "system-proxy"] }
# 代理 HTTP 客户端缓存的原子替换载体（ArcSwap：读侧无锁快照、写侧整体换新）
arc-swap = "1"
# rig 传输注入（代理经 rig-reqwest builder）
rig-reqwest = { version = "0.45.0", default-features = false, features = ["rustls"] }
process-wrap = { version = "10.0", features = [
    "tokio1",
    "process-group",
    "job-object",
    "kill-on-drop",
] }
glob = "0.3.3"
# 技能系统：SKILL.md frontmatter 的 YAML 解析（serde_yaml_ng，活跃维护 fork）
serde_yaml_ng = "0.10"
git2 = { version = "0.21.0", default-features = false }
# web_fetch 正文抽取：dom_smoothie（Readability 纯 Rust 移植）
dom_smoothie = "0.19.0"
# URL 解析（请求前预校验）
url = "2.5"
# DuckDuckGo HTML 结果列表解析（dom_smoothie 底层解析器，锁同版本）
dom_query = "0.29"
# 文档读取：xlsx→calamine、docx→docx-rs、pdf→pdf-extract（纯 Rust 零系统依赖）
calamine = "0.37"
docx-rs = "0.4"
pdf-extract = "0.12"
# docx 降级路径：zip + quick-xml 手解 word/document.xml
quick-xml = "0.42"
zip = "8.6"
# pdf 加密检测：lopdf 读 trailer /Encrypt
lopdf = "0.42"
# 派生索引库 cache/index.db：bundled = 自带 SQLite 静态链入
rusqlite = { version = "0.41.1", features = ["bundled"] }
# 用量记账的「当时本地日期」：仅 clock+std
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# 命令围栏 AST 写目标分析：tree-sitter runtime + bash/powershell grammar
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "0.26"

# 进程组收割：kill(-pgid, SIGTERM/SIGKILL)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Job Object 整树收割（TerminateJobObject/KILL_ON_JOB_CLOSE）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# 本地 OpenAI 兼容 mock SSE 服务（流保真 / 工具循环测试用）
axum = "0.8"
tokio = { version = "1", features = ["full"] }
# MCP：测试 fixture 的 server 面只在测试构建启用（feature unification：
# cargo build 不激活 dev-dependencies，生产二进制不带 server 面）
rmcp = { version = "3.5", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
# 看门狗：rig 剧本假模型（MockCompletionModel 直驱 drive_run 全链）
rig = { version = "0.45.0", features = ["test-utils"] }
