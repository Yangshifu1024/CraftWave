[package]
name = "craftwave-ui"
version = "0.1.0"
description = "CraftWave GPUI 应用壳（gpui-rewrite 阶段 2.B 应用骨架）"
edition = "2024"

# 二进制名 craftwave（命令行与产物名）；菜单栏显示名阶段 5 打包时由 Info.plist 定
[[bin]]
name = "craftwave"
path = "src/main.rs"

[dependencies]
# 依赖路线（craftwave-spike 07 号票决策）：应用只依赖 gpui-kit 门面一个 crate。
# 注意：不能同时直接依赖 crates.io 的 gpui 0.2.2——它与 gpui-kit 内部的
# gpui-pre-0.3.10 家族是两个实例，trait 互不相认（spike 已踩）。gpui_kit::* 即 gpui。
# gpui-pre 家族在本机（无完整 Xcode、无 metal 工具）编译运行通过，shader 无需
# build 期编译。版本一律钉死，升级显式提交（spec.md 贯穿纪律）。
gpui-kit = "0.8.1"
# spike 03 号票：官方 FPS HUD（叠加在窗口上，真 VSync 读数 + 帧耗时曲线）；
# 阶段 2.C 长会话性能观察时接入（fps_monitor 挂窗口根）
gpui-fps = "0.8.1"

# 引擎（帧流阶段 2.C 接入；本阶段用 util::atomic 的原子写盘）
craftwave-engine = { path = "../engine" }

# 壳自管小存档（窗口几何 / 界面缩放偏好）的序列化
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# UI 行为测试装置：#[gpui_kit::test]（GPUI 测试调度器 + 无头窗口渲染）。
# feature unification 会把本次构建的 gpui-kit 统一到 test-support——那只是
# 给 gpui 加测试钩子，不影响运行时行为（Wake 同款做法）。
[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }
