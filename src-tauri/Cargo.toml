[package]
name = "craftwave"
version = "0.1.0"
description = "本地优先的跨平台桌面 AI Agent"
edition = "2024"
rust-version = "1.97"

[lib]
name = "craftwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 引擎（gpui-rewrite 阶段 1）：代理运行/工具/存储/知识/MCP/git 纯库
craftwave-engine = { path = "../crates/engine" }
serde = { version = "1", features = ["derive"] }
# MCP：preserve_order = serde_json::Map 换 IndexMap 底座——mcp.json
# 的未知字段经 serde(flatten) round-trip 时保持出现顺序
#（不开则 BTreeMap 底座会按键排序重排，内容不丢但顺序漂移）
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-decoration = "3.0"
# 双版本验证：0.45.0 主底料；=0.46.0-rc.1 已平行重验通过（零改动）
rig = "0.45.0"
futures = "0.3"
# mock_chat 的 sleep（time feature）；后续后端模块本就会用到
# process/macros/sync/rt：命令子进程、select!、Notify、任务驱动
# net：SSRF 共享层的 tokio::net::lookup_host（DNS 解析校验）
tokio = { version = "1", default-features = false, features = ["time", "process", "macros", "sync", "rt", "net"] }
# CancellationToken（cancel_run 的置位载体）
tokio-util = { version = "0.7", features = ["rt"] }
# providers：keyring 4.2 默认 v1 feature = apple keychain / windows native / zbus-secret-service
# providers：ProviderConfig.id / ProviderModel.id 的 uuid v4
uuid = { version = "1", features = ["v4"] }
# storage：段指纹/条目内容哈希；tools：edit 版本指纹
sha2 = "0.11"
# storage：整文件原子写 temp+fsync+rename
tempfile = "3"
# tools：编码解码、ripgrep 内嵌、图片 base64
encoding_rs = "0.8.42"
chardetng = "1.0.0"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
# glob 工具的文件名模式匹配：选 globset
# ——依赖树已在（ignore 的底层依赖，锁面 0.4.20 不新增下载），显式声明取其
# Glob/GlobMatcher 的 `**` 递归语义；遍历仍走同源 ignore::WalkBuilder
# （与 list_files 一致尊重 .gitignore）。
globset = "0.4.20"
regex = "1.13.1"
base64 = "0.23.1"
# tools：命令输出 ANSI/OSC 清洗（纯 Rust，anstyle 生态）
anstream = "0.6"
# host：select_dir 原生目录选择（同步命令主线程模态；tauri-plugin-dialog 的同款内核，免 JS 插件与 capability）
rfd = "0.15"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-notification = "2.7.0"
# 全局热键：tauri-plugin-global-shortcut 2.x
# 官方插件。注册发起面在前端（插件 JS API 转调
# 插件命令）——注册冲突（被其他应用占用）的错误经 Promise 原生回传，设置页
# 红字 + Toast 零新增契约面；Rust 侧只挂 with_handler 回调（快捷键按下时
# toggle 主窗，host::shell::toggle_main_window）。
tauri-plugin-global-shortcut = "2"
# 应用内更新骨架：tauri-plugin-updater 2.x
# 官方插件——check/downloadAndInstall 全链在 Rust 侧执行
# （前端经插件 JS API 转调，下载不走 WebView，CSP connect-src 不动）；
# tauri-plugin-process 2.x 提供 relaunch（安装完成后的「重启以完成更新」）。
# pubkey 占位空串期间插件 check 必败，入口以 update_status.pubkeyConfigured
# 禁用兜底（骨架先行，密钥由 HITL 配齐后填入）。
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
open = "5"

# MCP 客户端：rig-rmcp 0.45 选型，
# 对齐锁定的 rig 0.45.0 并把 rmcp 锚定在 ^3.5（避免依赖树版本分裂）；
# rmcp 直依赖补充本仓需要的传输面：stdio 子进程 + streamable HTTP 客户端
# （reqwest rustls TLS）。tools.allow/deny 的 glob 工具名过滤用 glob crate；
# process-wrap 与 rmcp 的子进程传输同款内核（10.0/tokio1），用于给 stdio
# 子进程套进程组（Unix）/Job Object（Windows），断开/超时整树收割复用
# tools/process 的收割原语。
rig-rmcp = "0.45.0"
rmcp = { version = "3.5", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
# rmcp 的 streamable HTTP 客户端以 `reqwest?` 软依赖启用（feature 语法：
# "reqwest?/rustls"）——使用方须自带 reqwest；锁 rustls TLS（对齐本仓
# 无 OpenSSL 依赖纪律）。gzip 自动解压（现代网站按 Accept-Encoding
# 压缩响应，抓取正文须解压后才可交给 Readability）。
# socks：代理 manual 模式支持 socks5:// 与 socks5h://
# （socks5h = 域名由代理远端解析）；system-proxy：system 模式的 macOS
# SystemConfiguration / Windows 系统设置内建探测（此前
# system 模式只有环境变量探测；reqwest 0.13 的系统代理探测走该 feature）。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "socks", "system-proxy"] }
# 代理 HTTP 客户端缓存的原子替换载体（ArcSwap：读侧无锁快照、
# 写侧整体换新——save_config 热生效重建 client 时进行中请求持旧值跑完）。
# 版本对齐依赖树既有锁面（1.9.x），不新增下载。
arc-swap = "1"
# rig 传输注入（代理经 rig-reqwest builder）：
# ReqwestClient::from(配置好的 reqwest::Client) 包一层的即是本 crate；
# 版本对齐锁定的 rig 0.45.0（同版本族，不新增下载）。
rig-reqwest = { version = "0.45.0", default-features = false, features = ["rustls"] }
process-wrap = { version = "10.0", features = [
    "tokio1",
    "process-group",
    "job-object",
    "kill-on-drop",
] }
glob = "0.3.3"

# 技能系统：SKILL.md frontmatter 的 YAML 解析
# （name/description 必填、额外字段忽略以兼容 Claude 技能目录格式）。选
# serde_yaml_ng（serde_yaml 归档后的活跃维护 fork，纯 Rust unsafe-libyaml 内核，
# MIT/Apache 双许可）——frontmatter 的 description 常含冒号/引号/换行等合法
# YAML 语法，手写行解析易错，按「非必要不手写」走库。
serde_yaml_ng = "0.10"
git2 = { version = "0.21.0", default-features = false }

# web_fetch 正文抽取：dom_smoothie 为
# Mozilla Readability 算法的纯 Rust 移植（MIT，活跃维护，0.19.0 于 2026-10
# 发布），基于 dom_query（HTML5 解析）+ 内置 Markdown 输出（TextMode::Markdown，
# 经 dom_query 的 markdown 特性），备选 readability crate 久未维护不取。
# 选型标准：纯 Rust、MIT、中文正文实测可用（快照测试覆盖）。
dom_smoothie = "0.19.0"
# URL 解析（请求前预校验）：与 reqwest 内部同款解析器
#（url 2.x），Host::Ipv4/Ipv6/Domain 判别是 IP 字面量拦截的依据。
url = "2.5"
# DuckDuckGo HTML 结果列表解析（web_search）：
# dom_query 是 dom_smoothie 0.19 的底层 HTML5 解析器（已在依赖树内，锁面
# 同版本不新增下载），提供 CSS 选择器查询——SERP 列表提取按 class 定位
# 结果锚点与摘要块（属性顺序/引号形式无关），比正则宽松且对改版容错。
dom_query = "0.29"

# 文档读取三选（全部纯 Rust、
# MIT/Apache 兼容许可、零系统依赖）：
# - xlsx → calamine（只读 reader，worksheet_range 天然二维表；xls/xlsm/
#   xlsb/ods 顺带覆盖）；
# - docx → docx-rs（bokuweb，read_docx 读侧；两个开放缺陷 #873/#933 由
#   tools/doc.rs 的降级路径兜底）；
# - pdf → pdf-extract（extract_text_from_mem 系 API，内置 CMap 处理；对
#   不可信输入可能 panic #97/#141，工具边界 catch_unwind 包裹）。
calamine = "0.37"
docx-rs = "0.4"
pdf-extract = "0.12"
# docx 降级路径（兜底方案）：zip + quick-xml 手解 word/document.xml。
# quick-xml 0.42 已在依赖树内（tauri → plist），锁同版本不新增下载；
# zip 随 docx-rs 进入依赖树（8.6），声明同版本直接使用（calamine 另锁 9.1，
# 为上游各自声明，不强行归一）。
quick-xml = "0.42"
zip = "8.6"
# pdf 加密检测：lopdf 随 pdf-extract 进入依赖树（0.42），声明
# 同版本读取 trailer 的 /Encrypt 字典——加密文档在解析前给出明确错误，
# 不依赖解析器对加密文件的未定义行为。
lopdf = "0.42"
# 派生索引库 cache/index.db：stats_cache 表（stats_token
# 查询缓存，真相在 stats/*.json）。bundled feature = 自带 SQLite 源码经 cc
# 编译静态链入（免系统 libsqlite3 依赖，三平台构建一致；macOS 侧
# MACOSX_DEPLOYMENT_TARGET=13.0 对 C 编译同样生效）。
rusqlite = { version = "0.41.1", features = ["bundled"] }
# 用量记账的「当时本地日期」：0.4.45 已在依赖树内（tauri 等
# 间接依赖，锁同版本不新增下载）；仅开 clock+std（Local 日期面，无序列化
# 需求——日期以 YYYY-MM-DD 字符串进出 stats 文件与契约）。
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# 命令围栏 AST 写目标分析：
# tree-sitter 0.27 现行 runtime + 官方 bash grammar（tree-sitter-bash 0.25，
# 2025-12 更新）与 PowerShell grammar（tree-sitter-powershell 0.26，airbus-cert
# 维护，下载 488 万、2026-10 仍活跃更新——调研结论：crates.io 存在
# 维护良好的 PowerShell grammar，不降级词法）。两个 grammar crate 均以
# tree-sitter-language 提供语言静态量、C 源码经 cc 编译静态链入（零系统
# 依赖；MACOSX_DEPLOYMENT_TARGET=13.0 对 C 编译同样生效）。
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "0.26"

# 进程组收割：kill(-pgid, SIGTERM/SIGKILL)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Job Object 整树收割（TerminateJobObject/KILL_ON_JOB_CLOSE）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# macOS 通知授权态实查（设置页引导的数据面）：UNUserNotificationCenter
# 设置查询 + bundle id 早退判定。objc2 系已随桌面栈在依赖树内，版本与锁面一致
# （不新增下载）；插件自带的 permission_state 在桌面端恒报 Granted（2.7/2.8
# 源码核实），拿不到 macOS 真实授权态，故在此直查。
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
# 【交通灯精确摆位】host/commands/traffic_lights.rs：绕过 decoration 插件
# inset_y 的裁剪上限，setFrameOrigin 摆到 ZCode 同款 (22, 23)。objc2 系已在
# 依赖树内（插件同款版本，锁面一致，不新增下载）。
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSGeometry"] }
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    "UNNotificationSettings",
    "block2",
] }

[dev-dependencies]
# 契约导出（ipc_manifest_test）需要引擎类型带 TS derive——dev 构建激活
craftwave-engine = { path = "../crates/engine", features = ["ts"] }
# 本地 OpenAI 兼容 mock SSE 服务（流保真 / 工具循环测试用，不进产物）
axum = "0.8"
tokio = { version = "1", features = ["full"] }
# MCP：测试 fixture 的 MCP server 面只在测试构建启用——宏服务
# 定义（server/macros）、内存管道传输（transport-io）与本地回环 HTTP fixture
# （transport-streamable-http-server）；feature unification 下 cargo build
# 不激活 dev-dependencies，生产二进制不带 server 面。
rmcp = { version = "3.5", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
# 契约负载类型的 TS 声明生成器——测试构建下 derive(TS)，
# cargo test 导出 ui/src/ipc/generated/（生成物进 git，cargo build 不依赖生成步骤）。
# serde-compat 为默认 feature（解析 serde 属性）；serde-json-impl 让 Value 可导出。
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
# 看门狗：rig 剧本假模型（test_utils 的 MockCompletionModel）——
# 以"剧本流 + 假执行器"直驱 drive_run 全链验证 E_RUN_STALLED 终态；仅测试
# 构建启用（feature unification：cargo build 不含 test-utils，生产面不变）。
rig = { version = "0.45.0", features = ["test-utils"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# strip=true 会把 proc-macro dylib 的 LINKEDIT 剥出 mis-aligned（dyld 拒载，
# rustc 报 E0463 can't find crate）；proc-macro 只参与编译不进产物，不剥。
[profile.release.build-override]
strip = false
