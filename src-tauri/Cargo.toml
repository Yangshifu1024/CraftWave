[package]
name = "craftwave"
version = "0.1.0"
description = "本地优先的跨平台桌面 AI Agent"
edition = "2024"
rust-version = "1.97"

[lib]
name = "craftwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-decoration = "3.0"
# 【S1 spike 原型】mock_chat 的 sleep（time feature）；后续后端模块本就会用到
tokio = { version = "1", default-features = false, features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
