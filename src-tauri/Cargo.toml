[package]
name = "craftwave"
version = "0.1.0"
description = "本地优先的跨平台桌面 AI Agent"
edition = "2024"
rust-version = "1.97"

[lib]
name = "craftwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-decoration = "3.0"
# S2/S3 spike（C-6 双版本验证）：0.45.0 主底料；=0.46.0-rc.1 已平行重验通过（零改动）
rig = "0.45.0"
futures = "0.3"
# 【S1 spike 原型】mock_chat 的 sleep（time feature）；后续后端模块本就会用到
tokio = { version = "1", default-features = false, features = ["time"] }
encoding_rs = "0.8.42"
chardetng = "1.0.0"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
regex = "1.13.1"
sha2 = "0.11.1"
base64 = "0.23.1"

[dev-dependencies]
# 本地 OpenAI 兼容 mock SSE 服务（S2 流保真 / S3 工具循环测试用，不进产物）
axum = "0.8"
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
