[package]
name = "craftwave"
version = "0.1.0"
description = "本地优先的跨平台桌面 AI Agent"
edition = "2024"
rust-version = "1.97"

[lib]
name = "craftwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-decoration = "3.0"
# S2/S3 spike（C-6 双版本验证）：0.45.0 主底料；=0.46.0-rc.1 已平行重验通过（零改动）
rig = "0.45.0"
futures = "0.3"
# 【S1 spike 原型】mock_chat 的 sleep（time feature）；后续后端模块本就会用到
# 【S5 spike】process/macros/sync/rt：命令子进程、select!、Notify、任务驱动
tokio = { version = "1", default-features = false, features = ["time", "process", "macros", "sync", "rt"] }
# 【S5 spike】CancellationToken（§5.3 cancel_run 置位载体）
tokio-util = { version = "0.7", features = ["rt"] }
# storage（§7）：段指纹/条目内容哈希；tools：edit 版本指纹
sha2 = "0.11"
# storage（§7）：整文件原子写 temp+fsync+rename（§7.4）
tempfile = "3"
# tools（§8）：C-10 编码解码、ripgrep 内嵌、图片 base64
encoding_rs = "0.8.42"
chardetng = "1.0.0"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
regex = "1.13.1"
base64 = "0.23.1"

# 【S5 spike，cfg(unix)】进程组收割：kill(-pgid, SIGTERM/SIGKILL)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 【S5 spike，cfg(windows)】Job Object 整树收割（TerminateJobObject/KILL_ON_JOB_CLOSE）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# 本地 OpenAI 兼容 mock SSE 服务（S2 流保真 / S3 工具循环测试用，不进产物）
axum = "0.8"
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
